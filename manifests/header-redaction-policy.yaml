# Example AgentgatewayPolicy combining static regex guards (for patternable
# PII) with header-driven dynamic redaction (for per-request values only the
# calling app knows). See docs/header-redaction.md for the full feature
# documentation.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: pii-redaction
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: my-llm-route
  backend:
    ai:
      promptGuard:
        request:
        # Static, pattern-based PII — handled inline by the regex guard.
        - regex:
            action: Mask
            builtins:
            - Email
            - PhoneNumber
            - Ssn
            - CreditCard
            - CaSin
            matches:
            # UK NI number
            - '\b[A-CEGHJ-PR-TW-Z]{2}[0-9]{6}[A-D]\b'
            # UK postcode
            - '\b[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\b'
            # NHS number
            - '\b\d{3}\s?\d{3}\s?\d{4}\b'
            # UK vehicle registration
            - '\b[A-Z]{2}\d{2}\s?[A-Z]{3}\b'
            # IPv4
            - '\b(?:\d{1,3}\.){3}\d{1,3}\b'
            # URL
            - 'https?://\S+'
        # Dynamic per-request values — supplied by the caller as
        # `x-redact-<name>: <value>` headers. The gateway substitutes the
        # value with `[<NAME>]` (uppercased) before forwarding upstream,
        # then restores it in the response.
        - headerRedaction:
            headerPrefix: x-redact-
            tokenFormat: "[{NAME}]"
        response:
        # Restore the dynamic tokens after the LLM has responded.
        - headerRedaction:
            headerPrefix: x-redact-
            tokenFormat: "[{NAME}]"
